# Copié par outils/prepare-depot.sh vers .github/workflows/garde-nuit-nba.yml du dépôt public.
# Garde de nuit Set NBA, MODE ESSAI, LECTURE SEULE : toutes les N minutes, lit les compos Set NBA posées (jeton SORARE_JWT),
# repère les joueurs Out chez ESPN et note ce que la garde AURAIT remplacé (règle : sorare-compos/garde-nba.mjs).
# Rien n'est modifié sur Sorare (aucune requête d'écriture dans le script), aucun commit, aucun déploiement.
# Journal et résumé publics : des comptes seulement. Noms de joueurs : uniquement dans l'artifact (rapport.md, 7 jours).
name: "Nuit NBA : garde (mode essai)"

on:
  workflow_dispatch:
    inputs:
      duree_minutes:
        description: "Durée totale de la garde (minutes)"
        required: false
        default: "355"
      intervalle_minutes:
        description: "Intervalle entre deux relevés (minutes)"
        required: false
        default: "5"
  schedule:
    # Chaque nuit, mode essai (décision de l'utilisateur du 03/11/2026). 21h30 UTC = 22h30 à Bruxelles en hiver (23h30 en été) ;
    # GitHub démarre souvent ~30 min en retard : la garde couvre alors ≈ 23h00 → 04h55, avant les matchs de 04h00-04h30.
    - cron: "30 21 * * *"

permissions:
  contents: read

concurrency:
  group: garde-nuit-nba
  cancel-in-progress: false

jobs:
  garde:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Masquer le jeton dans les journaux
        env:
          SORARE_JWT: ${{ secrets.SORARE_JWT }}
        run: |
          if [ -n "$SORARE_JWT" ]; then echo "::add-mask::$SORARE_JWT"; echo "Jeton présent (masqué)."; else echo "Jeton SORARE_JWT absent : compos illisibles, ESPN seul."; fi

      # Les données de la collecte quotidienne (data/latest) viennent avec le dépôt : ce sont les candidats.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Garde de nuit (mode essai, lecture seule)
        env:
          SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
          SORARE_JWT: ${{ secrets.SORARE_JWT }}
          JWT_AUD: elpredatooor-nuit
          DUREE_MINUTES: ${{ inputs.duree_minutes || '355' }}
          INTERVALLE_MINUTES: ${{ inputs.intervalle_minutes || '5' }}
          DONNEES: data/latest
          SORTIE: garde-nuit-nba
        run: node outils/garde-nuit-nba.mjs

      # Alerte par e-mail (échec du job) si le jeton est absent, refusé, ou expire dans moins de 7 jours. N'affiche jamais le jeton.
      - name: Vérifier le jeton Sorare
        if: always()
        env:
          SORARE_JWT: ${{ secrets.SORARE_JWT }}
        run: |
          if grep -q -E "JETON (ABSENT|REFUSÉ)" garde-nuit-nba/journal.txt 2>/dev/null; then
            echo "::error::Jeton Sorare absent ou refusé : la garde n'a pas pu lire les compos. Recréer SORARE_JWT (docs/rapports/automatisation-nuit-nba.md)."; exit 1
          fi
          exp=$(node -e 'try{const p=JSON.parse(Buffer.from((process.env.SORARE_JWT||"").split(".")[1]||"","base64url"));console.log(p.exp||"")}catch{console.log("")}')
          if [ -n "$exp" ]; then
            jours=$(( (exp - $(date +%s)) / 86400 ))
            echo "Jeton Sorare : expire le $(date -u -d @$exp +%d/%m/%Y) (dans $jours jours)."
            if [ "$jours" -lt 7 ]; then echo "::error::Le jeton Sorare expire dans $jours jours : le recréer et remplacer le secret SORARE_JWT."; exit 1; fi
          fi

      - name: Joindre le compte rendu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garde-nuit-nba
          path: garde-nuit-nba/
          retention-days: 7
          if-no-files-found: warn
