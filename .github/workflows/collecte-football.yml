# Copié par outils/prepare-depot.sh vers .github/workflows/collecte-football.yml du dépôt public.
# Bouton manuel seulement (onglet Actions > « Collecte football seule » > Run workflow) : collecte football seulement, puis mise à jour
# de data/ et du site GitHub Pages pour ce sport ; les lignes NBA de data/latest restent celles de la collecte précédente.
# Tout le travail est fait par collecte.yml (workflow réutilisable, entrée sport) : mêmes tests, vérification, commit et
# déploiement ; il ne tourne jamais en même temps que la collecte quotidienne ni que l'autre collecte manuelle (groupe « collecte »).
name: Collecte football seule

on:
  workflow_dispatch: {}

jobs:
  collecte:
    permissions:
      contents: write   # commit des données dans data/
      pages: write      # déploiement GitHub Pages
      id-token: write   # exigé par actions/deploy-pages
    uses: ./.github/workflows/collecte.yml
    with:
      sport: football
    secrets: inherit
